name: Build & Release (三平台自动构建)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.11"
            artifact: EnergyPlus-MCP-Windows-x64.exe
          - os: macos-latest
            python: "3.11"
            artifact: EnergyPlus-MCP-macOS.dmg
          - os: ubuntu-latest
            python: "3.11"
            artifact: EnergyPlus-MCP-Linux-x86_64.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1 libsoup-3.0-0 libgirepository1.0-dev
      - name: Install Python deps
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m pip install --upgrade pip
          pip install -r gui/requirements.txt pyinstaller
      - name: Build package
        env:
          PYTHONIOENCODING: utf-8
        run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
