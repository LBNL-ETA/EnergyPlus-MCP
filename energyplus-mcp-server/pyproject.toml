[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energyplus-mcp-server"
version = "0.1.0"
description = "EnergyPlus MCP Server"
authors = [{name = "Han Li", email = "hanli@lbl.gov"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.10",
    "eppy",
    "matplotlib",
    "networkx",
    "pandas",
    "plotly",
    "graphviz",
    "pyyaml",
    "uvicorn[standard]",
    "python-dotenv",
]
license = {text = "MIT"}
keywords = ["EnergyPlus", "MCP", "server"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
homepage = "https://github.com/tsbyq/EnergyPlus_MCP"
repository = "https://github.com/tsbyq/EnergyPlus_MCP"

[tool.setuptools.packages.find]
where = ["."]
include = ["energyplus_mcp_server*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[project.optional-dependencies]
dev = [
    "ipykernel",
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "black",
    "ruff",
    "mypy",
    "httpx",
    "asgi-lifespan",
]
